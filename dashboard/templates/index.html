<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Anomaly Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .dot-green { background: #00ff88; }
        .dot-red { background: #ff0044; }
        .dot-yellow { background: #ffaa00; }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-size: 14px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(123, 47, 252, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #7b2ffc); }
        .btn-success { background: linear-gradient(135deg, #00ff88, #00cc66); color: #000; }
        .btn-danger { background: linear-gradient(135deg, #ff0044, #cc0033); }
        .btn-warning { background: linear-gradient(135deg, #ffaa00, #ff8800); color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.1); }
        
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 8px;
        }
        
        .input-group input {
            background: transparent;
            border: none;
            color: white;
            padding: 8px;
            width: 70px;
            font-size: 14px;
        }
        
        .input-group input:focus {
            outline: none;
        }
        
        .input-group label {
            color: #888;
            font-size: 14px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }
        
        .stat-card .label {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        
        /* Alerts Section */
        .alerts-section {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 30px;
        }
        
        .alerts-section h3 {
            color: #00d4ff;
            margin-bottom: 15px;
        }
        
        .alert-item {
            background: rgba(255,0,68,0.08);
            border-left: 3px solid #ff0044;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .alert-item.medium {
            border-left-color: #ffaa00;
            background: rgba(255,170,0,0.08);
        }
        
        .alert-item .time {
            color: #666;
            font-size: 12px;
        }
        
        .alert-item .details {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        
        .alert-item .details .label {
            color: #888;
        }
        
        .alert-item .severity {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .severity-high {
            background: #ff0044;
            color: white;
        }
        
        .severity-medium {
            background: #ffaa00;
            color: #000;
        }
        
        .no-alerts {
            color: #666;
            text-align: center;
            padding: 30px;
        }
        
        /* Log Area */
        .log-area {
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #00ff88;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .log-area::-webkit-scrollbar {
            width: 6px;
        }
        
        .log-area::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        
        .log-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        
        .log-entry {
            opacity: 0.9;
        }
        
        .log-entry.error {
            color: #ff0044;
        }
        
        .log-entry.success {
            color: #00ff88;
        }
        
        .log-entry.info {
            color: #00d4ff;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .controls .btn {
                width: 100%;
            }
            
            .alert-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        /* Loading animation */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #7b2ffc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🔍 Network Anomaly Detector</h1>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Checking...</span>
                <span style="margin-left: 15px; color: #666;">
                    Alerts: <span id="alertCount">0</span>
                </span>
            </div>
        </header>
        
        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" onclick="capturePackets()">
                📡 Capture Packets
            </button>
            
            <div class="input-group">
                <label>Count:</label>
                <input type="number" id="packetCount" value="50" min="10" max="500">
            </div>
            
            <button class="btn btn-success" onclick="trainModel()">
                🧠 Train Model
            </button>
            
            <button class="btn btn-primary" onclick="detectAnomalies()">
                🔍 Detect Anomalies
            </button>
            
            <button class="btn btn-danger" onclick="clearAlerts()">
                🗑️ Clear Alerts
            </button>
            
            <button class="btn btn-secondary" onclick="refreshStatus()">
                🔄 Refresh
            </button>
        </div>
        
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #888;">Processing...</p>
        </div>
        
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <span class="number" id="statPackets">0</span>
                <div class="label">Packets Analyzed</div>
            </div>
            <div class="stat-card">
                <span class="number" id="statAnomalies">0</span>
                <div class="label">Anomalies Found</div>
            </div>
            <div class="stat-card">
                <span class="number" id="statPercentage">0%</span>
                <div class="label">Anomaly Percentage</div>
            </div>
            <div class="stat-card">
                <span class="number" id="statAlerts">0</span>
                <div class="label">Total Alerts</div>
            </div>
        </div>
        
        <!-- Alerts -->
        <div class="alerts-section">
            <h3>⚠️ Recent Alerts</h3>
            <div id="alertsContainer">
                <div class="no-alerts">No alerts yet. Run detection to find anomalies.</div>
            </div>
        </div>
        
        <!-- Log -->
        <div class="log-area" id="logArea">
            <div class="log-entry info">🚀 Dashboard started. Waiting for actions...</div>
        </div>
    </div>
    
    <script>
        // ============================================
        // LOGGING
        // ============================================
        
        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        // ============================================
        // STATUS
        // ============================================
        
        async function refreshStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                const alertCount = document.getElementById('alertCount');
                
                if (data.model_loaded) {
                    dot.className = 'status-dot dot-green';
                    text.textContent = 'Model Loaded ✓';
                } else {
                    dot.className = 'status-dot dot-yellow';
                    text.textContent = 'No Model (Train First)';
                }
                
                alertCount.textContent = data.alerts_count || 0;
                
                addLog('Status updated: ' + (data.model_loaded ? 'Model loaded' : 'No model'), 'info');
            } catch (error) {
                addLog('Error refreshing status: ' + error.message, 'error');
            }
        }
        
        // ============================================
        // CAPTURE PACKETS
        // ============================================
        
        async function capturePackets() {
            const count = document.getElementById('packetCount').value;
            
            showLoading(true);
            addLog(`📡 Starting packet capture (${count} packets)...`, 'info');
            
            try {
                const response = await fetch('/api/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: parseInt(count) })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ ${data.message}`, 'success');
                } else {
                    addLog(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
            }
            
            showLoading(false);
            refreshStatus();
        }
        
        // ============================================
        // TRAIN MODEL
        // ============================================
        
        async function trainModel() {
            showLoading(true);
            addLog('🧠 Training anomaly detection model...', 'info');
            
            try {
                const response = await fetch('/api/train', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ ${data.message}`, 'success');
                } else {
                    addLog(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
            }
            
            showLoading(false);
            refreshStatus();
        }
        
        // ============================================
        // DETECT ANOMALIES
        // ============================================
        
        async function detectAnomalies() {
            showLoading(true);
            addLog('🔍 Running anomaly detection...', 'info');
            
            try {
                const response = await fetch('/api/detect', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.error) {
                    addLog(`❌ Error: ${data.error}`, 'error');
                } else {
                    // Update stats
                    document.getElementById('statPackets').textContent = data.total_packets || 0;
                    document.getElementById('statAnomalies').textContent = data.anomalies || 0;
                    document.getElementById('statPercentage').textContent = (data.anomaly_percentage || 0) + '%';
                    document.getElementById('statAlerts').textContent = data.alerts?.length || 0;
                    
                    addLog(`✅ Detection complete! Found ${data.anomalies || 0} anomalies`, 'success');
                    
                    // Display alerts
                    displayAlerts(data.recent_alerts || []);
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
            }
            
            showLoading(false);
            refreshStatus();
        }
        
        // ============================================
        // DISPLAY ALERTS
        // ============================================
        
        function displayAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '<div class="no-alerts">✅ No anomalies detected! Traffic looks normal.</div>';
                return;
            }
            
            let html = '';
            alerts.forEach(alert => {
                const severityClass = alert.severity === 'High' ? 'severity-high' : 'severity-medium';
                const alertClass = alert.severity === 'High' ? '' : 'medium';
                
                html += `
                    <div class="alert-item ${alertClass}">
                        <div>
                            <span class="severity ${severityClass}">${alert.severity}</span>
                            <span style="margin-left: 10px;">
                                ${alert.src_ip} → ${alert.dst_ip}
                            </span>
                        </div>
                        <div class="details">
                            <span><span class="label">Port:</span> ${alert.dst_port}</span>
                            <span><span class="label">Protocol:</span> ${alert.protocol}</span>
                            <span><span class="label">Size:</span> ${alert.packet_size}B</span>
                            <span><span class="label">Score:</span> ${alert.anomaly_score.toFixed(3)}</span>
                        </div>
                        <div class="time">${new Date(alert.timestamp).toLocaleString()}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ============================================
        // CLEAR ALERTS
        // ============================================
        
        async function clearAlerts() {
            try {
                await fetch('/api/clear_alerts', { method: 'POST' });
                document.getElementById('alertsContainer').innerHTML = '<div class="no-alerts">Alerts cleared.</div>';
                document.getElementById('statAlerts').textContent = '0';
                addLog('🗑️ Alerts cleared', 'info');
                refreshStatus();
            } catch (error) {
                addLog(`❌ Error clearing alerts: ${error.message}`, 'error');
            }
        }
        
        // ============================================
        // LOADING
        // ============================================
        
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.classList.add('active');
            } else {
                loading.classList.remove('active');
            }
        }
        
        // ============================================
        // AUTO-REFRESH
        // ============================================
        
        // Refresh status every 10 seconds
        setInterval(refreshStatus, 10000);
        
        // ============================================
        // INIT
        // ============================================
        
        refreshStatus();
        addLog('✅ Dashboard ready! Use the buttons above to control the system.', 'success');
    </script>
</body>
</html>
